<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-AI Chat Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d14;
      --bg2: #16161f;
      --bg3: #1e1e2a;
      --bg4: #252535;
      --border: #2e2e45;
      --border2: #3a3a58;
      --text: #e2e2f0;
      --text2: #8888aa;
      --text3: #555570;
      --accent: #6c63ff;
      --accent2: #9d96ff;
      --shadow: 0 4px 24px rgba(0,0,0,0.5);
      --radius: 10px;
      --openai: #10a37f;
      --anthropic: #d4652a;
      --gemini: #4285f4;
      --ollama: #7c3aed;
      --grok: #1d9bf0;
    }
    .light {
      --bg: #f0f0f5;
      --bg2: #ffffff;
      --bg3: #f5f5fa;
      --bg4: #eaeaf2;
      --border: #d0d0e0;
      --border2: #b0b0cc;
      --text: #111122;
      --text2: #555577;
      --text3: #9999bb;
      --shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background .25s, color .25s;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 100;
    }
    .logo {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }
    .topbar-tabs {
      display: flex;
      gap: 6px;
      flex: 1;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
    }
    .topbar-tabs::-webkit-scrollbar { display: none; }

    .ai-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      white-space: nowrap;
      transition: all .2s;
      user-select: none;
    }
    .ai-tab:hover { border-color: var(--border2); color: var(--text); }
    .ai-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ai-tab .tab-close {
      font-size: 12px;
      opacity: .6;
      padding: 0 2px;
      border-radius: 3px;
    }
    .ai-tab .tab-close:hover { opacity: 1; background: rgba(255,255,255,0.2); }

    .btn-add-tab {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px dashed var(--border2);
      background: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: all .2s;
    }
    .btn-add-tab:hover { border-color: var(--accent); color: var(--accent); }
    .btn-add-tab:disabled { opacity: .4; cursor: not-allowed; }

    .topbar-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      cursor: pointer;
      padding: 6px 10px;
      font-size: 14px;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn-icon:hover { border-color: var(--border2); color: var(--text); background: var(--bg3); }
    .btn-icon.active-btn { border-color: var(--accent); color: var(--accent); }

    /* ===== GRID ===== */
    .grid-container {
      flex: 1;
      display: grid;
      gap: 1px;
      background: var(--border);
      overflow: hidden;
    }
    .grid-1  { grid-template-columns: 1fr; }
    .grid-2  { grid-template-columns: 1fr 1fr; }
    .grid-3  { grid-template-columns: 1fr 1fr 1fr; }
    .grid-4  { grid-template-columns: 1fr 1fr; }
    .grid-5  { grid-template-columns: 1fr 1fr 1fr; }
    .grid-6  { grid-template-columns: 1fr 1fr 1fr; }

    /* ===== AI WINDOW ===== */
    .ai-window {
      background: var(--bg2);
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    .win-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
      flex-shrink: 0;
    }
    .win-provider-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .win-title {
      font-size: 13px;
      font-weight: 600;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .win-model-select {
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 11px;
      padding: 3px 6px;
      outline: none;
      cursor: pointer;
      max-width: 140px;
    }
    .win-model-select:focus { border-color: var(--accent); }
    .win-btn {
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: all .2s;
    }
    .win-btn:hover { color: var(--text); background: var(--bg4); }

    .win-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .win-messages::-webkit-scrollbar { width: 4px; }
    .win-messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .empty-win {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text3);
      font-size: 13px;
    }
    .empty-win .e-icon { font-size: 32px; opacity: .5; }

    /* ===== MESSAGES ===== */
    .msg {
      display: flex;
      gap: 8px;
      animation: msgIn .25s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      font-weight: 700;
    }
    .msg-body { max-width: 80%; display: flex; flex-direction: column; gap: 3px; }
    .msg.user .msg-body { align-items: flex-end; }
    .msg-bubble {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.assistant .msg-bubble {
      background: var(--bg4);
      border-bottom-left-radius: 3px;
    }
    .msg-time { font-size: 10px; color: var(--text3); }
    .msg-copy {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text3);
      cursor: pointer;
      font-size: 10px;
      padding: 1px 5px;
    }
    .msg-copy:hover { color: var(--text); border-color: var(--border2); }

    /* Thinking */
    .thinking-dots {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      background: var(--bg4);
      border-radius: 10px;
      border-bottom-left-radius: 3px;
      width: fit-content;
    }
    .thinking-dots span {
      width: 7px; height: 7px;
      background: var(--text3);
      border-radius: 50%;
      animation: dot 1.2s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: .2s; }
    .thinking-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot {
      0%,60%,100% { transform: translateY(0); opacity: .4; }
      30%          { transform: translateY(-6px); opacity: 1; }
    }

    /* Win-level send button */
    .win-footer {
      padding: 6px 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .win-input {
      flex: 1;
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      padding: 5px 8px;
      resize: none;
      max-height: 80px;
      min-height: 28px;
      line-height: 1.4;
    }
    .win-input::placeholder { color: var(--text3); }
    .win-input:focus { border-color: var(--accent); }
    .win-send {
      background: var(--accent);
      border: none;
      border-radius: 7px;
      color: #fff;
      cursor: pointer;
      padding: 6px 10px;
      font-size: 13px;
      transition: opacity .2s;
      flex-shrink: 0;
    }
    .win-send:hover { opacity: .85; }
    .win-send:disabled { opacity: .4; cursor: not-allowed; }

    /* ===== SHARED INPUT BAR ===== */
    .shared-bar {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .shared-bar-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .shared-textarea {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      padding: 10px 14px;
      resize: none;
      max-height: 150px;
      min-height: 44px;
      line-height: 1.5;
      transition: border-color .2s;
    }
    .shared-textarea::placeholder { color: var(--text3); }
    .shared-textarea:focus { border-color: var(--accent); }
    .btn-send-all {
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: opacity .2s, transform .1s;
    }
    .btn-send-all:hover { opacity: .9; }
    .btn-send-all:active { transform: scale(.97); }
    .btn-send-all:disabled { opacity: .4; cursor: not-allowed; }
    .shared-info {
      font-size: 11px;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .active-count {
      color: var(--accent2);
      font-weight: 600;
    }

    /* ===== MODALS ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeO .2s ease;
    }
    @keyframes fadeO { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 460px;
      max-width: 92vw;
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .modal-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; display: block; }
    .form-group { margin-bottom: 16px; }
    .form-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      padding: 9px 12px;
      transition: border-color .2s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      padding: 9px 12px;
      cursor: pointer;
    }
    .form-select:focus { border-color: var(--accent); }
    .form-textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      padding: 9px 12px;
      resize: vertical;
      min-height: 70px;
      transition: border-color .2s;
    }
    .form-textarea:focus { border-color: var(--accent); }

    .provider-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .p-option {
      padding: 12px 8px;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
    }
    .p-option:hover { border-color: var(--border2); background: var(--bg3); }
    .p-option.sel { border-color: var(--accent); background: rgba(108,99,255,.12); }
    .p-option .p-icon { font-size: 22px; }
    .p-option .p-name { font-size: 12px; font-weight: 600; margin-top: 4px; }
    .p-option .p-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }

    .modal-btns { display: flex; gap: 8px; margin-top: 4px; }
    .btn-cancel {
      flex: 1;
      padding: 10px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      transition: background .2s;
    }
    .btn-cancel:hover { background: var(--bg4); }
    .btn-confirm {
      flex: 2;
      padding: 10px;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: opacity .2s;
    }
    .btn-confirm:hover { opacity: .9; }

    .api-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .api-row input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: monospace;
    }
    .api-row .api-label { font-size: 12px; color: var(--text2); width: 72px; flex-shrink: 0; font-weight: 500; }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 80px;
      right: 20px;
      padding: 10px 16px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      box-shadow: var(--shadow);
      z-index: 2000;
      animation: toastIn .3s ease;
      max-width: 300px;
    }
    @keyframes toastIn {
      from { transform: translateX(80px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }
    .toast.ok  { border-left: 3px solid #10b981; }
    .toast.err { border-left: 3px solid #ef4444; }

    /* Markdown */
    .msg-bubble pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 6px 0;
      font-size: 12px;
    }
    .msg-bubble code { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; }
    .msg-bubble p code { background: rgba(0,0,0,.25); padding: 1px 5px; border-radius: 3px; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 4px 0; }
    .msg-bubble p { margin: 3px 0; }
    .msg-bubble h1 { font-size: 16px; margin: 8px 0 4px; }
    .msg-bubble h2 { font-size: 14px; margin: 6px 0 4px; }
    .msg-bubble h3 { font-size: 13px; margin: 5px 0 3px; }
    .msg-bubble strong { font-weight: 700; }
    .msg-bubble em { font-style: italic; }
    .msg-bubble table { border-collapse: collapse; font-size: 12px; margin: 6px 0; }
    .msg-bubble th, .msg-bubble td { border: 1px solid var(--border2); padding: 4px 8px; }
    .msg-bubble th { background: var(--bg); font-weight: 600; }

    /* Error state */
    .msg-error .msg-bubble { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">⚡ AI Hub</div>
  <div class="topbar-tabs" id="tabsRow"></div>
  <button class="btn-add-tab" id="btnAddTab" onclick="openAddModal()">＋ AI追加</button>
  <div class="topbar-actions">
    <button class="btn-icon" onclick="openSettings()">⚙️ 設定</button>
    <button class="btn-icon" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<!-- GRID -->
<div class="grid-container" id="gridContainer"></div>

<!-- SHARED INPUT -->
<div class="shared-bar">
  <div class="shared-bar-row">
    <textarea
      class="shared-textarea"
      id="sharedInput"
      placeholder="全AIに同時送信するメッセージ (Shift+Enter で改行, Enter で送信)"
      rows="1"
      oninput="autoResize(this)"
      onkeydown="sharedKeyDown(event)"
    ></textarea>
    <button class="btn-send-all" id="btnSendAll" onclick="sendToAll()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
      </svg>
      全AIに送信
    </button>
  </div>
  <div class="shared-info">
    <span>アクティブウィンドウ: <span class="active-count" id="winCount">0</span> / 6</span>
    <span>•</span>
    <span>個別送信は各ウィンドウ下部の入力欄を使用</span>
  </div>
</div>

<!-- ADD MODAL -->
<div class="overlay" id="addModal" style="display:none" onclick="overlayClose(event,'addModal')">
  <div class="modal">
    <h2>🤖 AIウィンドウを追加</h2>
    <div class="form-group">
      <label class="form-label">プロバイダー</label>
      <div class="provider-grid">
        <div class="p-option" id="po-openai" onclick="pickProvider('openai')">
          <div class="p-icon">🟢</div>
          <div class="p-name">OpenAI</div>
          <div class="p-sub">GPT-4o</div>
        </div>
        <div class="p-option" id="po-anthropic" onclick="pickProvider('anthropic')">
          <div class="p-icon">🟠</div>
          <div class="p-name">Anthropic</div>
          <div class="p-sub">Claude</div>
        </div>
        <div class="p-option" id="po-gemini" onclick="pickProvider('gemini')">
          <div class="p-icon">🔵</div>
          <div class="p-name">Gemini</div>
          <div class="p-sub">Gemini 2.0</div>
        </div>
        <div class="p-option" id="po-ollama" onclick="pickProvider('ollama')">
          <div class="p-icon">🟣</div>
          <div class="p-name">Ollama</div>
          <div class="p-sub">ローカル</div>
        </div>
        <div class="p-option" id="po-grok" onclick="pickProvider('grok')">
          <div class="p-icon">🔷</div>
          <div class="p-name">Grok</div>
          <div class="p-sub">xAI</div>
        </div>
        <div class="p-option" id="po-openai_compat" onclick="pickProvider('openai_compat')">
          <div class="p-icon">⚙️</div>
          <div class="p-name">カスタム</div>
          <div class="p-sub">OpenAI互換</div>
        </div>
      </div>
    </div>
    <div class="form-group" id="modelGroup" style="display:none">
      <label class="form-label">モデル</label>
      <select class="form-select" id="modalModel"></select>
    </div>
    <div class="form-group" id="customEndpointGroup" style="display:none">
      <label class="form-label">エンドポイントURL</label>
      <input type="text" class="form-input" id="customEndpoint" placeholder="http://localhost:11434">
    </div>
    <div class="form-group" id="sysPromptGroup" style="display:none">
      <label class="form-label">システムプロンプト（任意）</label>
      <textarea class="form-textarea" id="modalSysPrompt" placeholder="AIの役割を設定..."></textarea>
    </div>
    <div class="form-group" id="winNameGroup" style="display:none">
      <label class="form-label">ウィンドウ名</label>
      <input type="text" class="form-input" id="modalWinName" placeholder="例: コード質問">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('addModal')">キャンセル</button>
      <button class="btn-confirm" onclick="addWindow()">追加</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsModal" style="display:none" onclick="overlayClose(event,'settingsModal')">
  <div class="modal" style="width:500px">

<script>
// =========================================================
// STATE
// =========================================================
const MAX_WINDOWS = 6;

const MODELS = {
  openai: [
    { id:'gpt-4o',          label:'GPT-4o' },
    { id:'gpt-4o-mini',     label:'GPT-4o Mini' },
    { id:'gpt-4-turbo',     label:'GPT-4 Turbo' },
    { id:'o1-preview',      label:'o1 Preview' },
    { id:'o1-mini',         label:'o1 Mini' },
    { id:'gpt-3.5-turbo',   label:'GPT-3.5 Turbo' },
  ],
  anthropic: [
    { id:'claude-opus-4-7',              label:'Claude Opus 4.7' },
    { id:'claude-sonnet-4-6',            label:'Claude Sonnet 4.6' },
    { id:'claude-haiku-4-5-20251001',    label:'Claude Haiku 4.5' },
    { id:'claude-3-5-sonnet-20241022',   label:'Claude 3.5 Sonnet' },
    { id:'claude-3-5-haiku-20241022',    label:'Claude 3.5 Haiku' },
    { id:'claude-3-opus-20240229',       label:'Claude 3 Opus' },
  ],
  gemini: [
    { id:'gemini-2.0-flash',             label:'Gemini 2.0 Flash' },
    { id:'gemini-2.0-flash-thinking-exp',label:'Gemini 2.0 Flash Thinking' },
    { id:'gemini-1.5-pro',               label:'Gemini 1.5 Pro' },
    { id:'gemini-1.5-flash',             label:'Gemini 1.5 Flash' },
    { id:'gemini-1.5-flash-8b',          label:'Gemini 1.5 Flash-8B' },
  ],
  ollama: [],
  grok: [
    { id:'grok-3',          label:'Grok 3' },
    { id:'grok-3-mini',     label:'Grok 3 Mini' },
    { id:'grok-2',          label:'Grok 2' },
  ],
  openai_compat: [
    { id:'custom',          label:'カスタム (手動入力)' },
  ],
};

const PINFO = {
  openai:       { emoji:'🟢', color:'#10a37f', name:'OpenAI' },
  anthropic:    { emoji:'🟠', color:'#d4652a', name:'Anthropic' },
  gemini:       { emoji:'🔵', color:'#4285f4', name:'Gemini' },
  ollama:       { emoji:'🟣', color:'#7c3aed', name:'Ollama' },
  grok:         { emoji:'🔷', color:'#1d9bf0', name:'Grok' },
  openai_compat:{ emoji:'⚙️', color:'#888',    name:'カスタム' },
};

let state = {
  windows: [],       // { id, provider, model, name, systemPrompt, messages, endpoint }
  theme: 'dark',
  keys: { openai:'', anthropic:'', gemini:'', grok:'' },
};

let pendingProvider = null;
let busy = {};  // windowId => bool

// =========================================================
// INIT
// =========================================================
(function init() {
  const saved = localStorage.getItem('aihub-v2');
  if (saved) {
    try {
      const p = JSON.parse(saved);
      state.windows  = p.windows  || [];
      state.theme    = p.theme    || 'dark';
      state.keys     = { ...state.keys, ...(p.keys || {}) };
    } catch(e) {}
  }
  applyTheme();
  render();
  fetchOllamaModels();
})();

function save() {
  localStorage.setItem('aihub-v2', JSON.stringify(state));
}

// =========================================================
// THEME
// =========================================================
function applyTheme() {
  document.body.classList.toggle('light', state.theme === 'light');
  const isDark = state.theme === 'dark';
  const themeBtn = document.getElementById('themeBtn');
  if (themeBtn) themeBtn.textContent = isDark ? '🌙' : '☀️';
  const ttb = document.getElementById('themeToggleBtn');
  if (ttb) ttb.textContent = isDark ? '🌙 Dark' : '☀️ Light';
}
function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  save();
}

// =========================================================
// RENDER
// =========================================================
function render() {
  renderTabs();
  renderGrid();
  updateWinCount();
}

function renderTabs() {
  const row = document.getElementById('tabsRow');
  row.innerHTML = state.windows.map(w => {
    const info = PINFO[w.provider];
    return `<div class="ai-tab" id="tab-${w.id}">
      <span>${info.emoji}</span>
      <span>${esc(w.name)}</span>
      <span class="tab-close" onclick="removeWindow('${w.id}')">✕</span>
    </div>`;
  }).join('');

  const addBtn = document.getElementById('btnAddTab');
  addBtn.disabled = state.windows.length >= MAX_WINDOWS;
  addBtn.title = state.windows.length >= MAX_WINDOWS ? '最大6ウィンドウです' : '';
}

function renderGrid() {
  const gc = document.getElementById('gridContainer');
  const n = state.windows.length;
  gc.className = `grid-container grid-${n}`;

  if (n === 0) {
    gc.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text3);font-size:15px;grid-column:1/-1;">
      <div style="font-size:48px;opacity:.3;">🤖</div>
      <div style="font-weight:600;font-size:16px;color:var(--text2)">AIウィンドウを追加してください</div>
      <div>「＋ AI追加」ボタンから複数のAIをセットアップできます</div>
    </div>`;
    return;
  }

  gc.innerHTML = state.windows.map(w => buildWindow(w)).join('');
}

function buildWindow(w) {
  const info = PINFO[w.provider];
  const models = MODELS[w.provider];

  const modelOpts = models.length
    ? models.map(m => `<option value="${m.id}" ${m.id===w.model?'selected':''}>${m.label}</option>`).join('')
    : `<option value="${w.model}">${w.model}</option>`;

  const msgs = w.messages.length === 0
    ? `<div class="empty-win"><div class="e-icon">${info.emoji}</div><div>${info.name} · ${w.model}</div><div style="font-size:11px">メッセージを送信</div></div>`
    : w.messages.map(m => buildMsg(m, w)).join('');

  return `<div class="ai-window" id="win-${w.id}">
    <div class="win-header">
      <div class="win-provider-dot" style="background:${info.color}"></div>
      <div class="win-title">${esc(w.name)}</div>
      <select class="win-model-select" onchange="changeModel('${w.id}',this.value)">${modelOpts}</select>
      <button class="win-btn" title="クリア" onclick="clearWindow('${w.id}')">🧹</button>
      <button class="win-btn" title="エクスポート" onclick="exportWindow('${w.id}')">📤</button>
      <button class="win-btn" title="閉じる" onclick="removeWindow('${w.id}')">✕</button>
    </div>
    <div class="win-messages" id="msgs-${w.id}">${msgs}</div>
    <div class="win-footer">
      <textarea class="win-input" id="winput-${w.id}" rows="1"
        placeholder="個別送信..."
        onkeydown="winKeyDown(event,'${w.id}')"
        oninput="autoResize(this)"></textarea>
      <button class="win-send" id="wsend-${w.id}" onclick="sendToWindow('${w.id}')">送信</button>
    </div>
  </div>`;
}

function buildMsg(m, w) {
  const info = PINFO[w.provider];
  const isUser = m.role === 'user';
  const time = new Date(m.ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  const content = isUser ? esc(m.content).replace(/\n/g,'<br>') : mdToHtml(m.content);
  const errClass = m.error ? ' msg-error' : '';

  return `<div class="msg ${isUser?'user':'assistant'}${errClass}">
    <div class="msg-avatar ${isUser?'':''}` +
      (isUser
        ? `" style="background:linear-gradient(135deg,#6c63ff,#a855f7);color:#fff">You`
        : `" style="background:${info.color}22">${info.emoji}`) +
    `</div>
    <div class="msg-body">
      <div class="msg-bubble">${content}</div>
      <div style="display:flex;gap:6px;align-items:center;">
        <span class="msg-time">${time}</span>
        ${!isUser?`<button class="msg-copy" onclick="copyMsg('${w.id}','${m.id}')">コピー</button>`:''}
      </div>
    </div>
  </div>`;
}

// =========================================================
// WINDOW MANAGEMENT
// =========================================================
function openAddModal() {
  if (state.windows.length >= MAX_WINDOWS) {
    toast('最大6ウィンドウまでです', 'err');
    return;
  }
  pendingProvider = null;
  document.querySelectorAll('.p-option').forEach(el => el.classList.remove('sel'));
  document.getElementById('modelGroup').style.display = 'none';
  document.getElementById('sysPromptGroup').style.display = 'none';
  document.getElementById('winNameGroup').style.display = 'none';
  document.getElementById('customEndpointGroup').style.display = 'none';
  document.getElementById('modalSysPrompt').value = '';
  document.getElementById('modalWinName').value = '';
  document.getElementById('addModal').style.display = 'flex';
}

function pickProvider(p) {
  pendingProvider = p;
  document.querySelectorAll('.p-option').forEach(el => el.classList.remove('sel'));
  document.getElementById('po-' + p).classList.add('sel');

  const models = MODELS[p];
  const modelSel = document.getElementById('modalModel');
  if (models.length) {
    modelSel.innerHTML = models.map(m => `<option value="${m.id}">${m.label}</option>`).join('');
    document.getElementById('modelGroup').style.display = 'block';
  } else if (p === 'ollama') {
    modelSel.innerHTML = MODELS.ollama.length
      ? MODELS.ollama.map(m => `<option value="${m.id}">${m.label}</option>`).join('')
      : '<option value="">モデル名を入力してください</option>';
    document.getElementById('modelGroup').style.display = 'block';
  } else {
    document.getElementById('modelGroup').style.display = 'none';
  }

  document.getElementById('customEndpointGroup').style.display =
    (p === 'ollama' || p === 'openai_compat') ? 'block' : 'none';

  if (p === 'ollama') document.getElementById('customEndpoint').value = 'http://localhost:11434';
  if (p === 'openai_compat') document.getElementById('customEndpoint').value = '';

  document.getElementById('sysPromptGroup').style.display = 'block';
  document.getElementById('winNameGroup').style.display = 'block';
}

function addWindow() {
  if (!pendingProvider) { toast('プロバイダーを選択してください', 'err'); return; }

  const model  = document.getElementById('modalModel').value || MODELS[pendingProvider][0]?.id || 'default';
  const sys    = document.getElementById('modalSysPrompt').value.trim();
  const name   = document.getElementById('modalWinName').value.trim()
                 || `${PINFO[pendingProvider].name} ${state.windows.length + 1}`;
  const endpoint = document.getElementById('customEndpoint').value.trim();

  if (state.windows.length >= MAX_WINDOWS) { toast('最大6ウィンドウまでです', 'err'); return; }

  const id = 'w' + Date.now();
  state.windows.push({ id, provider: pendingProvider, model, name, systemPrompt: sys, messages: [], endpoint });
  closeModal('addModal');
  save();
  render();
  toast(`「${name}」を追加しました`, 'ok');
}

function removeWindow(id) {
  state.windows = state.windows.filter(w => w.id !== id);
  delete busy[id];
  save();
  render();
}

function clearWindow(id) {
  if (!confirm('このウィンドウの会話をクリアしますか？')) return;
  const w = state.windows.find(w => w.id === id);
  if (!w) return;
  w.messages = [];
  save();
  const msgs = document.getElementById('msgs-' + id);
  if (msgs) {
    const info = PINFO[w.provider];
    msgs.innerHTML = `<div class="empty-win"><div class="e-icon">${info.emoji}</div><div>${info.name} · ${w.model}</div></div>`;
  }
}

function changeModel(id, model) {
  const w = state.windows.find(w => w.id === id);
  if (!w) return;
  w.model = model;
  save();
}

function exportWindow(id) {
  const w = state.windows.find(w => w.id === id);
  if (!w) return;
  const text = w.messages.map(m =>
    `[${m.role === 'user' ? 'You' : 'AI'}] ${new Date(m.ts).toLocaleString('ja-JP')}\n${m.content}`
  ).join('\n\n---\n\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${w.name}_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

function updateWinCount() {
  document.getElementById('winCount').textContent = state.windows.length;
}

// =========================================================
// SENDING
// =========================================================
function sharedKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendToAll(); }
}
function winKeyDown(e, id) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendToWindow(id); }
}

async function sendToAll() {
  const input = document.getElementById('sharedInput');
  const text = input.value.trim();
  if (!text || state.windows.length === 0) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('btnSendAll').disabled = true;

  await Promise.allSettled(state.windows.map(w => doSend(w.id, text)));
  document.getElementById('btnSendAll').disabled = false;
}

async function sendToWindow(id) {
  const input = document.getElementById('winput-' + id);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  await doSend(id, text);
}

async function doSend(id, text) {
  if (busy[id]) return;
  const w = state.windows.find(w => w.id === id);
  if (!w) return;

  busy[id] = true;
  setBusy(id, true);

  // Add user message
  const userMsg = { id: 'm'+Date.now()+Math.random(), role:'user', content:text, ts:Date.now() };
  w.messages.push(userMsg);
  appendMsg(id, userMsg, w);
  clearEmptyState(id, w);
  save();

  // Show thinking
  showThinking(id, w);

  try {
    const reply = await callAPI(w);
    removeThinking(id);
    const aMsg = { id: 'm'+Date.now()+Math.random(), role:'assistant', content:reply, ts:Date.now() };
    w.messages.push(aMsg);
    appendMsg(id, aMsg, w);
    save();
  } catch(err) {
    removeThinking(id);
    const errMsg = { id: 'm'+Date.now()+Math.random(), role:'assistant', content:'❌ ' + err.message, ts:Date.now(), error:true };
    w.messages.push(errMsg);
    appendMsg(id, errMsg, w);
    save();
  } finally {
    busy[id] = false;
    setBusy(id, false);
  }
}

function clearEmptyState(id, w) {
  const msgs = document.getElementById('msgs-' + id);
  if (msgs && msgs.querySelector('.empty-win')) {
    msgs.innerHTML = '';
  }
}

function appendMsg(id, m, w) {
  const msgs = document.getElementById('msgs-' + id);
  if (!msgs) return;
  const div = document.createElement('div');
  div.innerHTML = buildMsg(m, w);
  msgs.appendChild(div.firstElementChild);
  msgs.scrollTop = msgs.scrollHeight;
}

function showThinking(id, w) {
  const msgs = document.getElementById('msgs-' + id);
  if (!msgs) return;
  const info = PINFO[w.provider];
  const div = document.createElement('div');
  div.id = 'thinking-' + id;
  div.className = 'msg assistant';
  div.innerHTML = `
    <div class="msg-avatar" style="background:${info.color}22">${info.emoji}</div>
    <div class="thinking-dots"><span></span><span></span><span></span></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeThinking(id) {
  const el = document.getElementById('thinking-' + id);
  if (el) el.remove();
}

function setBusy(id, b) {
  const btn = document.getElementById('wsend-' + id);
  const inp = document.getElementById('winput-' + id);
  if (btn) btn.disabled = b;
  if (inp) inp.disabled = b;
}

// =========================================================
// API CALLS
// =========================================================
async function callAPI(w) {
  switch(w.provider) {
    case 'openai':       return callOpenAI(w);
    case 'anthropic':    return callAnthropic(w);
    case 'gemini':       return callGemini(w);
    case 'ollama':       return callOllama(w);
    case 'grok':         return callGrok(w);
    case 'openai_compat':return callOpenAICompat(w);
    default: throw new Error('Unknown provider');
  }
}

async function callOpenAI(w) {
  const key = state.keys.openai;
  if (!key) throw new Error('OpenAI APIキーが未設定です (設定 ⚙️ から追加)');
  const msgs = buildOpenAIMsgs(w);
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
    body: JSON.stringify({ model:w.model, messages:msgs, max_tokens:4096 })
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error('OpenAI: ' + (e.error?.message||res.statusText)); }
  const d = await res.json();
  return d.choices[0].message.content;
}

async function callAnthropic(w) {
  const key = state.keys.anthropic;
  if (!key) throw new Error('Anthropic APIキーが未設定です (設定 ⚙️ から追加)');
  const messages = w.messages.slice(-30).map(m => ({ role:m.role, content:m.content }));
  const body = { model:w.model, max_tokens:4096, messages };
  if (w.systemPrompt) body.system = w.systemPrompt;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error('Anthropic: ' + (e.error?.message||res.statusText)); }
  const d = await res.json();
  return d.content[0].text;
}

async function callGemini(w) {
  const key = state.keys.gemini;
  if (!key) throw new Error('Gemini APIキーが未設定です (設定 ⚙️ から追加)');
  const contents = [];
  if (w.systemPrompt) {
    contents.push({ role:'user', parts:[{text:w.systemPrompt}] });
    contents.push({ role:'model', parts:[{text:'はい、承知しました。'}] });
  }
  for (const m of w.messages.slice(-30)) {
    contents.push({ role: m.role==='user'?'user':'model', parts:[{text:m.content}] });
  }
  const modelId = `models/${w.model}`;
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/${modelId}:generateContent?key=${key}`,
    {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents, generationConfig:{ maxOutputTokens:4096, temperature:0.7 } })
    }
  );
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error('Gemini: ' + (e.error?.message||res.statusText)); }
  const d = await res.json();
  if (!d.candidates?.[0]?.content?.parts?.[0]?.text) throw new Error('Gemini: 応答が空です');
  return d.candidates[0].content.parts[0].text;
}

async function callOllama(w) {
  const base = w.endpoint || 'http://localhost:11434';
  const msgs = buildOpenAIMsgs(w);
  const res = await fetch(`${base}/api/chat`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:w.model, messages:msgs, stream:false })
  }).catch(() => { throw new Error('Ollamaに接続できません。Ollamaが起動しているか確認してください。'); });
  if (!res.ok) throw new Error('Ollama: ' + res.statusText);
  const d = await res.json();
  return d.message.content;
}

async function callGrok(w) {
  const key = state.keys.grok;
  if (!key) throw new Error('Grok APIキーが未設定です (設定 ⚙️ から追加)');
  const msgs = buildOpenAIMsgs(w);
  const res = await fetch('https://api.x.ai/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
    body: JSON.stringify({ model:w.model, messages:msgs, max_tokens:4096 })
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error('Grok: ' + (e.error?.message||res.statusText)); }
  const d = await res.json();
  return d.choices[0].message.content;
}

async function callOpenAICompat(w) {
  const base = (w.endpoint || '').replace(/\/$/, '');
  if (!base) throw new Error('エンドポイントURLが設定されていません');
  const msgs = buildOpenAIMsgs(w);
  const res = await fetch(`${base}/v1/chat/completions`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ model:w.model, messages:msgs })
  }).catch(() => { throw new Error('エンドポイントに接続できません: ' + base); });
  if (!res.ok) throw new Error('カスタムAPI: ' + res.statusText);
  const d = await res.json();
  return d.choices[0].message.content;
}

function buildOpenAIMsgs(w) {
  const msgs = [];
  if (w.systemPrompt) msgs.push({ role:'system', content:w.systemPrompt });
  msgs.push(...w.messages.slice(-30).map(m => ({ role:m.role, content:m.content })));
  return msgs;
}

// =========================================================
// OLLAMA MODEL DISCOVERY
// =========================================================
async function fetchOllamaModels() {
  try {
    const res = await fetch('http://localhost:11434/api/tags', { signal:AbortSignal.timeout(2000) });
    if (!res.ok) return;
    const d = await res.json();
    MODELS.ollama = (d.models||[]).map(m => ({ id:m.name, label:m.name }));
  } catch(e) {}
}

// =========================================================
// SETTINGS
// =========================================================
function openSettings() {
  document.getElementById('key-openai').value    = state.keys.openai    || '';
  document.getElementById('key-anthropic').value = state.keys.anthropic || '';
  document.getElementById('key-gemini').value    = state.keys.gemini    || '';
  document.getElementById('key-grok').value      = state.keys.grok      || '';
  document.getElementById('settingsModal').style.display = 'flex';
  applyTheme();
}

function saveKey(provider, val) {
  state.keys[provider] = val;
  save();
}

function togglePwd(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

function exportAll() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `aihub-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = async e => {
    try {
      const text = await e.target.files[0].text();
      const d = JSON.parse(text);
      if (d.windows) { state.windows = d.windows; state.keys = {...state.keys, ...(d.keys||{})}; save(); render(); toast('インポートしました', 'ok'); }
      else toast('無効なファイルです', 'err');
    } catch(e) { toast('インポート失敗: ' + e.message, 'err'); }
  };
  inp.click();
}

function clearAll() {
  if (!confirm('全ての会話とウィンドウを削除しますか？')) return;
  state.windows = [];
  save(); render();
  closeModal('settingsModal');
  toast('全データを消去しました', 'ok');
}

// =========================================================
// COPY
// =========================================================
function copyMsg(wid, mid) {
  const w = state.windows.find(w => w.id === wid);
  if (!w) return;
  const m = w.messages.find(m => m.id === mid);
  if (!m) return;
  navigator.clipboard.writeText(m.content).then(() => toast('コピーしました', 'ok'));
}

// =========================================================
// MODAL HELPERS
// =========================================================
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function overlayClose(e, id) { if (e.target.classList.contains('overlay')) closeModal(id); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.overlay').forEach(el => el.style.display='none');
});

// =========================================================
// UTILITY
// =========================================================
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 2800);
}

// =========================================================
// MARKDOWN
// =========================================================
function mdToHtml(text) {
  // Fenced code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code class="lang-${lang||''}">${esc(code.trim())}</code></pre>`);
  // Inline code
  text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // Tables (simple)
  text = text.replace(/^\|(.+)\|\s*\n\|[-| :]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm, (_, hdr, rows) => {
    const ths = hdr.split('|').filter(s=>s.trim()).map(h=>`<th>${esc(h.trim())}</th>`).join('');
    const trs = rows.trim().split('\n').map(row => {
      const tds = row.split('|').filter(s=>s.trim()).map(c=>`<td>${esc(c.trim())}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });
  // Bold & italic
  text = text.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  // Headers
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm,   '<h1>$1</h1>');
  // Lists
  text = text.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  text = text.replace(/((?:<li>.*<\/li>\n?)+)/g, s => `<ul>${s}</ul>`);
  // Blockquotes
  text = text.replace(/^> (.+)$/gm, '<blockquote style="border-left:3px solid var(--border2);padding-left:10px;color:var(--text2);margin:4px 0;">$1</blockquote>');
  // Horizontal rule
  text = text.replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:8px 0;">');
  // Paragraphs
  const parts = text.split(/\n\n+/);
  text = parts.map(p => {
    if (/^<(h[1-3]|ul|ol|pre|table|blockquote|hr)/.test(p.trim())) return p;
    return `<p>${p.replace(/\n/g,'<br>')}</p>`;
  }).join('');
  return text;
}
